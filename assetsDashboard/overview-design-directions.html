<div id="overview-directions">
  <style>
    #overview-directions{color:var(--foreground);font-family:var(--font-sans,system-ui,sans-serif)}
    #overview-directions .directions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
    #overview-directions figure{margin:0;min-width:0}
    #overview-directions figcaption{margin:10px 0 0;font-weight:500}
    #overview-directions figcaption span{display:block;color:var(--muted-foreground);font-size:.9em;font-weight:400;margin-top:3px}
    #overview-directions .shot{background:#0b1020;border:1px solid color-mix(in srgb,var(--border) 70%,transparent);border-radius:12px;overflow:hidden;aspect-ratio:1.18;box-shadow:0 12px 28px color-mix(in srgb,#000 18%,transparent);font-size:7px;color:#dce5f5}
    #overview-directions .bar{height:12%;display:flex;align-items:center;justify-content:space-between;padding:0 7%;border-bottom:1px solid #22314b;color:#91a4c3}
    #overview-directions .brand{font-weight:700;color:#f0f5ff;font-size:1.2em}.dot{color:#52d2a7}.nav{display:flex;gap:8px}.nav i{display:block;width:21px;height:3px;background:#263651;border-radius:4px}.nav i:first-child{background:#7198ff}
    #overview-directions .main{padding:6% 7%}.kicker{color:#899ab7;font-size:.78em;letter-spacing:.08em}.title{font-size:1.55em;font-weight:700;letter-spacing:-.04em;margin:3% 0}.value{font-size:2.35em;font-weight:700;letter-spacing:-.07em}.up{color:#5cd5aa}.sub{color:#8b9ab3;margin-top:2%}
    #overview-directions .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:4%;margin-top:6%}.stat{padding:6%;background:#121c2d;border:1px solid #22314b;border-radius:6px}.stat b{font-size:1.35em;display:block;margin:8% 0 3%}.stat small{color:#8b9ab3;font-size:.8em}
    #overview-directions .chart{height:25%;margin-top:5%;background:#111b2b;border:1px solid #22314b;border-radius:7px;padding:5%;position:relative;overflow:hidden}.chart:after{content:"";position:absolute;inset:35% 5% 12%;background:linear-gradient(180deg,transparent 0 20%,#22314b 20% 22%,transparent 22% 48%,#22314b 48% 50%,transparent 50% 76%,#22314b 76% 78%,transparent 78%)}.line{position:absolute;z-index:1;left:7%;right:7%;bottom:21%;height:48%;border-top:2px solid #5cd5aa;clip-path:polygon(0 72%,13% 55%,25% 69%,39% 31%,52% 50%,65% 19%,78% 37%,88% 12%,100% 0,100% 10%,88% 23%,78% 48%,65% 30%,52% 61%,39% 42%,25% 80%,13% 66%,0 83%);background:#5cd5aa33}
    #overview-directions .focus{background:linear-gradient(145deg,#0d1526,#121e35)}#overview-directions .focus .value{font-size:2.1em}#overview-directions .focus .hero{padding:7%;border-radius:8px;background:linear-gradient(115deg,#1c3b71,#172550);border:1px solid #365895}#overview-directions .focus .hero .sub{display:flex;justify-content:space-between}.focus .stats{grid-template-columns:1fr 1fr;margin-top:5%;gap:3%}.focus .chart{height:31%;margin-top:5%}
    #overview-directions .calm{background:#0e1522}.calm .main{padding-top:8%}.calm .title{margin-bottom:7%}.calm .holdings{display:grid;gap:4%;margin-top:7%}.calm .holding{display:grid;grid-template-columns:11% 1fr auto;align-items:center;gap:5%;padding:3% 0;border-bottom:1px solid #243148}.icon{height:18px;border-radius:50%;background:#6f8cf4}.holding:nth-child(2) .icon{background:#54cda5}.holding:nth-child(3) .icon{background:#d9a267}.holding b{font-size:1.05em}.holding small{display:block;color:#899ab3;margin-top:3%}.holding em{font-style:normal;color:#dce5f5}.calm .chart{height:16%;margin-top:8%}
    @media(max-width:650px){#overview-directions .directions{grid-template-columns:1fr}#overview-directions .shot{aspect-ratio:1.65}}
  </style>
  <div class="directions" role="group" aria-label="Three proposed overview-page directions">
    <figure><div class="shot"><div class="bar"><span class="brand">A<span class="dot">.</span></span><span class="nav"><i></i><i></i><i></i></span></div><div class="main"><div class="kicker">TOTAL PORTFOLIO VALUE</div><div class="value">$128,640</div><div class="sub"><span class="up">+4.8% this month</span></div><div class="stats"><div class="stat"><small>Invested</small><b>$119.2k</b><small>cost basis</small></div><div class="stat"><small>Today</small><b class="up">+$920</b><small>0.7%</small></div><div class="stat"><small>Assets</small><b>12</b><small>3 classes</small></div></div><div class="chart"><div class="line"></div></div></div></div><figcaption>01 — Performance-first<span>Best if daily movement is the key reason to open the app.</span></figcaption></figure>
    <figure><div class="shot focus"><div class="bar"><span class="brand">A<span class="dot">.</span></span><span class="nav"><i></i><i></i><i></i></span></div><div class="main"><div class="hero"><div class="kicker">NET WORTH</div><div class="value">$128,640</div><div class="sub"><span>Updated 4m ago</span><span class="up">+4.8%</span></div></div><div class="stats"><div class="stat"><small>Cash</small><b>$18.4k</b></div><div class="stat"><small>Invested</small><b>$110.2k</b></div></div><div class="chart"><div class="line"></div></div></div></div><figcaption>02 — Calm financial home<span>Recommended: one clear balance, then gentle context and trends.</span></figcaption></figure>
    <figure><div class="shot calm"><div class="bar"><span class="brand">A<span class="dot">.</span></span><span class="nav"><i></i><i></i><i></i></span></div><div class="main"><div class="kicker">OVERVIEW</div><div class="title">Your holdings</div><div class="sub">$128,640 total <span class="up">+4.8%</span></div><div class="holdings"><div class="holding"><span class="icon"></span><span><b>US stocks</b><small>48% of portfolio</small></span><em>$61.8k</em></div><div class="holding"><span class="icon"></span><span><b>Crypto</b><small>31% of portfolio</small></span><em>$39.9k</em></div><div class="holding"><span class="icon"></span><span><b>Gold</b><small>21% of portfolio</small></span><em>$26.9k</em></div></div><div class="chart"><div class="line"></div></div></div></div><figcaption>03 — Holdings-first<span>Best for a long-term portfolio where allocation matters most.</span></figcaption></figure>
  </div>
</div>
